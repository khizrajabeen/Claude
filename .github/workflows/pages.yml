# Publishes the dashboard to GitHub Pages.
#
# Pages serves static files. It cannot run the bot — that lives on a
# machine you control (see deploy/README.md), which publishes its JSON
# into web/data and pushes. This workflow only ships what is already in
# the repository.
name: Deploy dashboard

on:
  push:
    # The default branch is where the `github-pages` environment allows
    # deployments from, unless its branch policy is widened. Listing
    # several here costs nothing and means this deploys from whichever
    # one the repository settles on.
    branches: [main, claude/crypto-trading-bot-V7qg4, claude/happy-brown-j5y8bv]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push win rather than queueing
# behind a stale one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if credentials were ever committed
        run: |
          # The dashboard is public, so anything under web/ is public.
          #
          # The patterns require a realistic run of key characters after
          # each prefix. An earlier version matched the bare prefixes and
          # failed on settings.html's own placeholder text ("sk-ant-…"),
          # which is the classic way a security check gets disabled: it
          # cries wolf on the file it most needs to watch.
          PATTERNS='sk-ant-[A-Za-z0-9_-]{24,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|(PK|AK)[A-Z0-9]{16,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if grep -rIlnE "$PATTERNS" web/ 2>/dev/null; then
            echo "::error::Something that looks like a real API key is in web/ — refusing to publish."
            exit 1
          fi
          echo "No credential-shaped strings found in web/."

      # No `enablement: true`. It asks GitHub to create the Pages site as
      # part of the deploy, which needs a token allowed to change
      # repository settings — and when that permission is absent the step
      # fails even though Pages is already enabled and nothing needs
      # creating. Pages is turned on by hand once; this step only reads
      # the configuration.
      - id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explain a Pages failure in words
        if: steps.configure.outcome == 'failure'
        run: |
          echo "::error title=Pages cannot deploy from this branch::See the job log."
          cat <<'EOF'
          ────────────────────────────────────────────────────────────
          The dashboard is built and committed. Two settings decide
          whether it can publish, and both are repository settings
          rather than anything in this repository:

          1. Pages must be enabled, with Actions as its source:
               Settings → Pages → Build and deployment
               Source: GitHub Actions

          2. The `github-pages` environment must allow THIS branch.
             When Pages is first enabled it permits the default branch
             only, so a deploy from any other branch is rejected before
             a single step runs — which is why a failing job here can
             show two seconds of runtime and no logs at all.

               Settings → Environments → github-pages
               → Deployment branches and tags → add this branch

             Or merge to the default branch and let it deploy there.

          Nothing else is wrong: the files are in web/, the credential
          scan passed, and the tests are green.
          ────────────────────────────────────────────────────────────
          EOF
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Where it went
        run: |
          echo "Dashboard: ${{ steps.deploy.outputs.page_url }}"
          echo "Portfolio: ${{ steps.deploy.outputs.page_url }}dashboard.html"
