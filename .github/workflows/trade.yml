# Paper-only daily experiment. Replaces the legacy day --fast/live-data cycle.
name: Trade

on:
  push:
    branches: ["claude/happy-brown-j5y8bv"]
    paths:
      - "bot/trading/daily_paper.py"
      - "bot/strategies/daily_candidates.py"
      - "research/paper_daily.json"
      - ".github/workflows/trade.yml"
  schedule:
    # Several recovery opportunities after the UTC daily candle closes.
    - cron: "15,30,45 0,1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only; do not submit paper orders"
        type: boolean
        default: true

concurrency:
  group: trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify paper execution regressions
        run: python -m pytest -q tests/test_daily_candidates.py tests/test_review_findings.py tests/test_reconcile.py
      - name: Real-clock paper cycle
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: "true"
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "::error::Alpaca paper credentials are missing from repository secrets."
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python -m bot.trading.daily_paper
          else
            python -m bot.trading.daily_paper --submit
          fi
      - name: Preserve immutable run evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: paper-journal/daily-v1/runs/
          retention-days: 90
          if-no-files-found: ignore
      - name: Persist order recovery state
        if: always()
        run: |
          if [ ! -f paper-journal/daily-v1/state.json ]; then exit 0; fi
          git config user.name "meridian-bot"
          git config user.email "meridian-bot@users.noreply.github.com"
          git add paper-journal/daily-v1/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "paper: persist daily strategy order state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
