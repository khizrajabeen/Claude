# ============================================================
#  Daily Crypto Trading Bot — Configuration
# ============================================================
# Copy to config.local.yaml and put API keys there, or in .env.
# config.local.yaml is gitignored; never commit keys.

exchange:
  name: "kraken"           # binance | kraken | coinbase | okx | kucoin | bybit
  market_type: "spot"      # spot | swap  (swap enables funding accrual)
  api_key: ""
  api_secret: ""
  sandbox: false           # paper mode needs no keys and no sandbox
  trust_env: true          # honour HTTPS_PROXY (ccxt disables this by default)
  verify_ca: ""            # optional CA bundle path
  timeout_ms: 30000
  max_retries: 4

# ── Universe and data ────────────────────────────────────────
data:
  # One universe, four asset classes. Each instrument carries its own
  # calendar, cost model and timeframe ladder, so a Nasdaq stock and a
  # Bitcoin perp can sit in the same book without either being a special
  # case. Perps are the leveraged, always-on, shortable leg; spot is the
  # unlevered one; equities and ETFs only trade when their session is open.
  instruments:
    # ── Crypto perpetual futures (24/7, fundable, shortable) ──
    - {symbol: "BTC/USDT:USDT", asset_class: "crypto_perp", venue: "okx"}
    - {symbol: "ETH/USDT:USDT", asset_class: "crypto_perp", venue: "okx"}
    - {symbol: "SOL/USDT:USDT", asset_class: "crypto_perp", venue: "okx"}
    # ── Crypto spot (24/7, unlevered, long only) ──
    # Widened from five names to fifteen. Spot longs were the best leg of
    # the 90-day replay (+0.248R over 32 trades) and a cross-sectional
    # ranking needs enough peers to rank. Every pair here clears $10M of
    # 24h quote volume on OKX; below that the spread eats the edge.
    - {symbol: "BTC/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "ETH/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "SOL/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "XRP/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "LINK/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "DOGE/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "SUI/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "UNI/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "NEAR/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "ARB/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "LTC/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "ADA/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "AVAX/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "FIL/USDT", asset_class: "crypto_spot", venue: "okx"}
    - {symbol: "BCH/USDT", asset_class: "crypto_spot", venue: "okx"}
    # ── US equities (session-bound, daily bars) ──
    - {symbol: "NVDA", asset_class: "equity", venue: "nasdaq"}
    - {symbol: "AAPL", asset_class: "equity", venue: "nasdaq"}
    - {symbol: "MSFT", asset_class: "equity", venue: "nasdaq"}
    - {symbol: "TSLA", asset_class: "equity", venue: "nasdaq"}
    - {symbol: "AMD",  asset_class: "equity", venue: "nasdaq"}
    - {symbol: "COIN", asset_class: "equity", venue: "nasdaq"}
    # ── ETFs (the index leg: cheaper, slower, lower beta) ──
    - {symbol: "SPY", asset_class: "etf", venue: "nasdaq"}
    - {symbol: "QQQ", asset_class: "etf", venue: "nasdaq"}
    - {symbol: "GLD", asset_class: "etf", venue: "nasdaq"}
  timeframe: "1h"          # fallback when an instrument names none
  higher_timeframe: "4h"   # fallback trend filter
  history_bars: 900        # must cover the longest strategy lookback
  orderbook_depth: 20
  orderbook_levels: 10
  train_days: 180
  # The bot picks its own decision timeframe each day per instrument from
  # realised volatility and how much session is left. A quiet tape gets a
  # slower frame (fewer, better trades); a wild one gets a faster frame so
  # the stop is not a day wide. Turning this off pins everything to
  # data.timeframe above.
  adaptive_timeframes: true
  equity:
    cache_hours: 6         # Nasdaq's endpoint is daily; re-asking is waste
    max_retries: 3
    throttle_seconds: 0.5

# ── The trading day ──────────────────────────────────────────
# Crypto never closes, so the "day" is a convention anchored to the UTC
# boundary exchanges use for daily candles and funding settlement.
session:
  day_open: "00:00"                # briefing runs here
  entry_window_minutes: 120        # how long each entry slot stays open
  # Crypto runs 24/7 and US stocks do not, so the day carries several entry
  # slots rather than one morning window. Crypto gets a slot at every
  # 4-hour boundary — where its higher-timeframe bar closes and a trend
  # filter can actually change its mind. Equities get one inside their own
  # session, inset past the opening auction and stopping well short of the
  # bell. Set enabled: false to go back to a single window at the day open.
  entry_slots:
    enabled: true
    crypto_every_hours: 4
    equity_open_delay_minutes: 30   # the first half hour is all gap and spread
    equity_entry_cutoff_minutes: 90 # no new stock with less than this to manage
  allow_late_start: true           # starting mid-day gets one fresh window
  flatten_at: "23:30"              # close intraday book before the boundary
  manage_interval_seconds: 900     # how often the book is walked
  max_new_positions_per_day: 6      # across the whole universe
  # Crypto's first slot opens at 00:00 and the US session not until 13:30,
  # so without a per-class reservation crypto would spend the whole daily
  # budget before a stock could be looked at — and the cross-asset
  # comparison would be crypto versus nothing.
  max_new_positions_per_class: 2
  carry_overnight: true            # trend systems need multi-day holds;
                                   # a nightly flatten pays the round trip again
                                   # every morning for no reason
  max_holding_days: 10             # hard cap even when carrying
  max_entry_drift_r: 0.5           # don't chase a plan that already ran
  entry_stagger_seconds: 0

# ── Risk ─────────────────────────────────────────────────────
# Fixed dollar risk per trade at an ATR stop, capped by portfolio heat.
risk:
  risk_per_trade_pct: 0.75         # of equity, lost if the stop is hit
  min_risk_per_trade_pct: 0.10
  max_portfolio_heat_pct: 4.0      # total open risk if every stop hits
  max_open_positions: 8            # 4 asset classes now share the book
  max_correlated_positions: 3      # crypto majors trade as one factor
  max_net_beta: 1.5                # beta-weighted exposure vs equity
  max_daily_loss_pct: 2.0          # circuit breaker, measured on equity
  daily_profit_lock_pct: 4.0       # stand down after a good day (0 = off)
  max_total_drawdown_pct: 15.0     # hard halt
  derisk_after_losses: 3
  cooldown_after_losses: 2
  cooldown_minutes: 120
  min_edge_cost_ratio: 3.0         # expected move must be 3x the round trip
  # The round trip as a fraction of what the trade risks:
  #     cost_R = round_trip_bps / (10000 * atr_stop_mult * atr_pct)
  # A 90-day replay found +0.024R per trade gross against 0.043R per trade
  # in costs — execution took the whole edge. This refuses trades whose
  # toll is too large a share of their risk, which in practice means
  # skipping quiet markets where the same signal costs twice as much.
  # Measured and switched off. A sweep over one fixed 90-day window gave
  #   off -1.34% | 0.20 -2.00% | 0.14 -3.18% | 0.10 -1.00% | 0.08 +0.18%
  #   | 0.06 -4.23%
  # which is not a trend, it is noise: the single positive reading sits
  # between two worse-than-baseline ones. Fees fell exactly as expected
  # ($247 -> $99 -> $48) and returns did not improve, so the edge is not
  # concentrated in the cheap trades — cutting trades cuts gross edge in
  # the same proportion. The reasoning behind the gate stands; the
  # evidence for this lever does not. Set above 0 to re-enable.
  max_cost_r: 0.0
  contrarian_risk_factor: 0.7      # fades get less size than confirmations

# ── Stops, targets and trailing ──────────────────────────────
stops:
  atr_period: 14
  atr_stop_mult: 2.0               # stop distance = 2 x ATR
  target_r_multiple: 2.0           # first target at 2R
  breakeven_at_r: 1.0              # move stop to entry once 1R is banked
  breakeven_pad_bps: 8             # ... just past entry, to cover fees
  trail_after_r: 1.0
  trail_atr_mult: 2.5              # trail 2.5 ATR behind the extreme
  time_stop_bars: 48               # cut a trade that goes nowhere
  min_stop_bps: 30                 # floor, guards against a degenerate ATR
  max_stop_bps: 1200               # ceiling

# ── Position sizing ──────────────────────────────────────────
sizing:
  max_position_pct: 20.0           # notional cap as % of equity
  vol_target_annual_pct: 40.0      # per-position volatility budget
  min_position_usd: 25
  kelly_fraction: 0.25             # quarter-Kelly, as a cap only
  kelly_min_trades: 30             # ... once there is a real sample

# ── Strategies ───────────────────────────────────────────────
# Two families. `selective` are published trend systems that trade rarely
# and were the only group to survive an out-of-sample split. `lux` are
# indicator-style signals of the kind LuxAlgo and its peers publish,
# implemented mechanically so the measurement decides.
#
# Six earlier strategies were removed after measuring poorly: a house trend
# model, cross-sectional momentum, a Donchian breakout, short-term
# reversion, funding carry and dual momentum.
strategies:
  enabled:
    # selective — survived the out-of-sample split
    - clenow       # Clenow: EMA50/100 filter + 100-bar extreme, 3 ATR stop
    - turtle       # Dennis & Eckhardt 1983: 20/55 Donchian, N sizing, 2N stop
    - holygrail    # Raschke & Connors: ADX>30, pullback to the 20 EMA
    # lux — indicator-style, measured not trusted
    - supertrend   # SuperTrend factors clustered by realised performance
    - smc          # structure breaks, liquidity sweeps, fair value gaps
    - nwenvelope   # Nadaraya-Watson envelope (non-repainting endpoint form)
    - lorentzian   # kNN over historical market states, Lorentzian distance
    # news — the wire, not the chart; equities and ETFs only
    - news         # per-company sentiment, coverage-weighted and trend-gated

  news:
    asset_classes: ["equity", "etf"]   # crypto's tape is fast enough already
    min_articles: 6                    # a lone excitable headline is not a signal
    min_score: 0.12
    min_strength: 0.05                 # consensus x coverage x magnitude
    fresh_weight: 0.4                  # how much recency scales the signal
    require_trend_agreement: true      # no buying good news in a downtrend
    horizon_bars: 5

  turtle:
    entry_s1: 20
    entry_s2: 55
    exit_s1: 10
    n_period: 20                   # N is the 20-period ATR
    stop_n: 2.0
    pyramid_step_n: 0.5
    max_units: 4
    last_winner_filter: true       # skip S1 if the last breakout would have won

  clenow:
    fast_ema: 50
    slow_ema: 100
    breakout_bars: 100
    atr_period: 20
    stop_atr: 3.0

  holygrail:
    adx_period: 14
    adx_floor: 30.0
    ema_period: 20
    touch_atr: 0.5                 # how close to the EMA counts as a touch
    swing_lookback: 20

  supertrend:
    atr_period: 10
    min_factor: 1.0
    max_factor: 5.0
    factor_step: 0.5
    performance_window: 200        # how far back each factor is scored

  smc:
    swing_length: 10
    sweep_lookback: 30
    sweep_reversal_atr: 0.5
    dealing_range_bars: 60
    use_fvg: true

  nwenvelope:
    bandwidth: 8.0
    window: 200
    multiplier: 3.0
    max_adx: 35.0                  # never fade a strong trend

  lorentzian:
    neighbours: 8
    horizon: 4                     # bars ahead each neighbour votes on
    spacing: 4                     # so neighbours are not one afternoon
    history_bars: 500
    normalise_window: 200          # trailing, never whole-series
    min_vote_ratio: 0.6
    adx_floor: 20.0

# ── Autopilot ────────────────────────────────────────────────
# The roster manages itself: strategies that earn a materially negative
# record over a real sample are benched to a probe allocation, and the
# survivors are tilted toward whatever suits the current tape. Nothing here
# needs adjusting by hand.
autopilot:
  enabled: true
  min_trades_to_judge: 25          # never judge a strategy on a small sample
  bench_below_expectancy_r: -0.15  # well below zero, not at it
  probe_weight: 0.05               # a benched strategy keeps a foot in the door
  regime_tilt: true
  max_benched_fraction: 0.5        # if most are losing, the setting is wrong

# ── Portfolio construction ───────────────────────────────────
portfolio:
  weighting: "inverse_vol"         # inverse_vol | equal | manual
  correlation_haircut: true        # shrink strategies that duplicate others
  max_strategy_weight: 0.40
  min_strategy_weight: 0.05
  # max_weights:                   # per-strategy caps, if one needs one
  #   smc: 0.20
  lookback_days: 60
  min_history_days: 10
  min_agreement: 0.0               # raise to require strategy consensus
  breadth_floor: 0.6               # conviction a lone strategy keeps
  # weights: {trend: 0.4, xsmom: 0.3, breakout: 0.2, reversion: 0.1}

# ── Portfolio volatility targeting ───────────────────────────
# The best-evidenced lever on drawdown: exposure scales down when realised
# volatility rises, and left-tail events cluster in high-volatility periods.
vol_target:
  enabled: true
  target_annual_pct: 15.0
  min_scale: 0.25
  max_scale: 1.5
  window_days: 20
  min_days: 8
  cut_speed: 1.0                   # de-risk immediately
  restore_speed: 0.25              # re-risk slowly
  drawdown_throttle: true
  throttle_start_pct: 4.0
  throttle_floor: 0.35

# ── Signal tilts ─────────────────────────────────────────────
# Modifiers on what the strategies decided. None can open a trade alone.
signals:
  min_edge_score: 0.15             # |edge| below this is noise
  news_weight: 0.15                # news tilts, it never triggers alone
  book_weight: 0.06                # order-book imbalance, confirmation only
  news_can_veto: true
  require_htf_agreement: true      # except for market-neutral strategies
  # The major trend, read two rungs above the decision frame — daily for
  # crypto, weekly for equities. require_htf_agreement uses a 21/55 EMA
  # cross on the 4h bar, which is nine days of history and flips on every
  # pullback. Over a 90-day replay in which crypto rose 42-77%, the bot
  # took 120 shorts against 67 longs and the shorts averaged -0.078R;
  # nothing in the read could see the move it was fighting.
  # A direction is reported only when price and the slope of the long
  # average agree, so an ambiguous long-term picture constrains nothing.
  require_primary_trend: true
  primary_trend_period: 200
  primary_trend_slope_bars: 20
  # Relative strength within the asset class. Absolute momentum says an
  # instrument is rising; relative momentum says whether it is the one
  # worth owning — in a window where everything rose 42-77%, "trending up"
  # was true of the whole universe and picked nothing.
  # A long must rank above `momentum_band`, a short below 1 - band.
  # 0 disables it. Off by default until the sweep says otherwise.
  momentum_band: 0.0
  momentum_min_peers: 4
  momentum_lookback: 60

# ── Tradability filters ──────────────────────────────────────
filters:
  min_quote_volume_24h: 5000000    # skip illiquid books
  max_spread_bps: 25
  min_atr_pct: 0.15                # too quiet to pay the fees
  max_atr_pct: 12.0                # too wild to size sanely
  min_bars: 120

# ── News / sentiment ─────────────────────────────────────────
news:
  enabled: true
  fetch_interval_seconds: 300
  retention_hours: 48
  half_life_hours: 6.0             # headline impact decays fast
  tilt_window_hours: 8
  tone_window_hours: 12
  signal_threshold: 0.35
  fresh_window_hours: 6            # "has the tape had time to price this?"
  fetch_workers: 8                 # feeds are fetched in parallel
  fetch_timeout_seconds: 15
  min_articles: 2
  per_feed_limit: 30
  # feeds:                         # override the defaults if you like
  #   - {url: "https://cointelegraph.com/rss", weight: 1.0}

# ── Paper trading / execution costs ──────────────────────────
paper:
  initial_balance: 10000.0
  fee_maker_bps: 2.0
  fee_taker_bps: 5.5
  slippage_bps: 3.0
  impact_coefficient: 0.5          # square-root market impact (of daily vol)
  reference_daily_vol_bps: 300.0   # fallback vol for the impact model
  max_slippage_bps: 100.0          # sanity cap on modelled slippage
  funding_enabled: true
  default_funding_bps: 1.0         # per 8h settlement when unknown

# ── Records ──────────────────────────────────────────────────
journal:
  dir: "state"
  rolling_window: 50               # trades used for adaptive risk

# ── Machine learning (optional) ──────────────────────────────
# The daily session runs without any of this. When models are trained they
# add a fifth view to the edge blend.
model:
  enabled: false
  ensemble_weights:
    xgboost: 0.4
    lightgbm: 0.4
    lstm: 0.2
  min_confidence: 0.55
  sequence_length: 60
  features_top_k: 60
labeling:
  method: "triple_barrier"
  atr_period: 14
  upper_barrier_atr: 2.0
  lower_barrier_atr: 2.0
  max_holding_bars: 48
validation:
  n_splits: 5
  embargo_pct: 1.0                 # embargo after each test fold

# ── Logging ──────────────────────────────────────────────────
logging:
  level: "INFO"
  log_to_file: true
  log_file: "trading_bot.log"
