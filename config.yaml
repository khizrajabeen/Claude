# ============================================================
#  Daily Crypto Trading Bot — Configuration
# ============================================================
# Copy to config.local.yaml and put API keys there, or in .env.
# config.local.yaml is gitignored; never commit keys.

exchange:
  name: "kraken"           # binance | kraken | coinbase | okx | kucoin | bybit
  market_type: "spot"      # spot | swap  (swap enables funding accrual)
  api_key: ""
  api_secret: ""
  sandbox: false           # paper mode needs no keys and no sandbox
  trust_env: true          # honour HTTPS_PROXY (ccxt disables this by default)
  verify_ca: ""            # optional CA bundle path
  timeout_ms: 30000
  max_retries: 4

# ── Universe and data ────────────────────────────────────────
data:
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "XRP/USDT"
    - "ADA/USDT"
    - "LINK/USDT"
  timeframe: "1h"          # the decision timeframe
  higher_timeframe: "4h"   # trend filter
  history_bars: 600        # must cover the longest strategy lookback
  orderbook_depth: 20
  orderbook_levels: 10
  train_days: 180

# ── The trading day ──────────────────────────────────────────
# Crypto never closes, so the "day" is a convention anchored to the UTC
# boundary exchanges use for daily candles and funding settlement.
session:
  day_open: "00:00"                # briefing runs here
  entry_window_minutes: 120        # new positions only in this window
  allow_late_start: true           # starting mid-day gets one fresh window
  flatten_at: "23:30"              # close intraday book before the boundary
  manage_interval_seconds: 900     # how often the book is walked
  max_new_positions_per_day: 3
  carry_overnight: false           # true = let winners run into tomorrow
  max_holding_days: 3              # hard cap even when carrying
  max_entry_drift_r: 0.5           # don't chase a plan that already ran
  entry_stagger_seconds: 0

# ── Risk ─────────────────────────────────────────────────────
# Fixed dollar risk per trade at an ATR stop, capped by portfolio heat.
risk:
  risk_per_trade_pct: 0.75         # of equity, lost if the stop is hit
  min_risk_per_trade_pct: 0.10
  max_portfolio_heat_pct: 4.0      # total open risk if every stop hits
  max_open_positions: 5
  max_correlated_positions: 3      # crypto majors trade as one factor
  max_net_beta: 1.5                # beta-weighted exposure vs equity
  max_daily_loss_pct: 2.0          # circuit breaker, measured on equity
  daily_profit_lock_pct: 4.0       # stand down after a good day (0 = off)
  max_total_drawdown_pct: 15.0     # hard halt
  derisk_after_losses: 3
  cooldown_after_losses: 2
  cooldown_minutes: 120

# ── Stops, targets and trailing ──────────────────────────────
stops:
  atr_period: 14
  atr_stop_mult: 2.0               # stop distance = 2 x ATR
  target_r_multiple: 2.0           # first target at 2R
  breakeven_at_r: 1.0              # move stop to entry once 1R is banked
  breakeven_pad_bps: 8             # ... just past entry, to cover fees
  trail_after_r: 1.0
  trail_atr_mult: 2.5              # trail 2.5 ATR behind the extreme
  time_stop_bars: 48               # cut a trade that goes nowhere
  min_stop_bps: 30                 # floor, guards against a degenerate ATR
  max_stop_bps: 1200               # ceiling

# ── Position sizing ──────────────────────────────────────────
sizing:
  max_position_pct: 20.0           # notional cap as % of equity
  vol_target_annual_pct: 40.0      # per-position volatility budget
  min_position_usd: 25
  kelly_fraction: 0.25             # quarter-Kelly, as a cap only
  kelly_min_trades: 30             # ... once there is a real sample

# ── Strategies ───────────────────────────────────────────────
# Each is a separate return driver. Combining weakly correlated drivers is
# what shrinks drawdown — far more than improving any single signal.
strategies:
  enabled:
    - trend        # time-series momentum, the CTA workhorse
    - xsmom        # cross-sectional momentum, ~market neutral
    - breakout     # Donchian channel break out of compression
    - reversion    # short-term reversal, the hedge against trend whipsaw
    - carry        # perpetual funding, only where funding exists

  trend:
    horizons: [24, 72, 336]        # bars: ~1d / 3d / 2w on 1h
    horizon_weights: [0.25, 0.40, 0.35]
    vol_window: 72
    adx_floor: 18.0

  xsmom:
    lookback_bars: 168
    skip_bars: 12                  # 12-1 style: skip the reversal window
    quantile: 0.34                 # top/bottom third
    min_universe: 4
    vol_adjust: true

  breakout:
    channel_bars: 55
    compression_window: 120
    require_compression: true
    max_extension_atr: 1.5

  reversion:
    zscore_window: 24
    entry_z: 1.6
    max_adx: 32.0                  # never fade a strong trend

  carry:
    entry_bps: 1.0                 # per 8h settlement, ~11%/yr
    extreme_bps: 5.0
    max_bps: 15.0
    # Funding has compressed since 2024 and a disciplined rule now rarely
    # fires. That is correct behaviour, not a broken strategy.

# ── Portfolio construction ───────────────────────────────────
portfolio:
  weighting: "inverse_vol"         # inverse_vol | equal | manual
  correlation_haircut: true        # shrink strategies that duplicate others
  max_strategy_weight: 0.40
  min_strategy_weight: 0.05
  max_weights:
    carry: 0.15                    # low daily vol, fat tail — cap it
  lookback_days: 60
  min_history_days: 10
  min_agreement: 0.0               # raise to require strategy consensus
  # weights: {trend: 0.4, xsmom: 0.3, breakout: 0.2, reversion: 0.1}

# ── Portfolio volatility targeting ───────────────────────────
# The best-evidenced lever on drawdown: exposure scales down when realised
# volatility rises, and left-tail events cluster in high-volatility periods.
vol_target:
  enabled: true
  target_annual_pct: 15.0
  min_scale: 0.25
  max_scale: 1.5
  window_days: 20
  min_days: 8
  cut_speed: 1.0                   # de-risk immediately
  restore_speed: 0.25              # re-risk slowly
  drawdown_throttle: true
  throttle_start_pct: 4.0
  throttle_floor: 0.35

# ── Signal tilts ─────────────────────────────────────────────
# Modifiers on what the strategies decided. None can open a trade alone.
signals:
  min_edge_score: 0.15             # |edge| below this is noise
  news_weight: 0.15                # news tilts, it never triggers alone
  book_weight: 0.06                # order-book imbalance, confirmation only
  news_can_veto: true
  require_htf_agreement: true      # except for market-neutral strategies

# ── Tradability filters ──────────────────────────────────────
filters:
  min_quote_volume_24h: 5000000    # skip illiquid books
  max_spread_bps: 25
  min_atr_pct: 0.15                # too quiet to pay the fees
  max_atr_pct: 12.0                # too wild to size sanely
  min_bars: 120

# ── News / sentiment ─────────────────────────────────────────
news:
  enabled: true
  fetch_interval_seconds: 300
  retention_hours: 48
  half_life_hours: 6.0             # headline impact decays fast
  tilt_window_hours: 8
  tone_window_hours: 12
  signal_threshold: 0.35
  min_articles: 2
  per_feed_limit: 30
  # feeds:                         # override the defaults if you like
  #   - {url: "https://cointelegraph.com/rss", weight: 1.0}

# ── Paper trading / execution costs ──────────────────────────
paper:
  initial_balance: 10000.0
  fee_maker_bps: 2.0
  fee_taker_bps: 5.5
  slippage_bps: 3.0
  impact_coefficient: 0.5          # square-root market impact (of daily vol)
  reference_daily_vol_bps: 300.0   # fallback vol for the impact model
  max_slippage_bps: 100.0          # sanity cap on modelled slippage
  funding_enabled: true
  default_funding_bps: 1.0         # per 8h settlement when unknown

# ── Records ──────────────────────────────────────────────────
journal:
  dir: "state"
  rolling_window: 50               # trades used for adaptive risk

# ── Machine learning (optional) ──────────────────────────────
# The daily session runs without any of this. When models are trained they
# add a fifth view to the edge blend.
model:
  enabled: false
  ensemble_weights:
    xgboost: 0.4
    lightgbm: 0.4
    lstm: 0.2
  min_confidence: 0.55
  sequence_length: 60
  features_top_k: 60
labeling:
  method: "triple_barrier"
  atr_period: 14
  upper_barrier_atr: 2.0
  lower_barrier_atr: 2.0
  max_holding_bars: 48
validation:
  n_splits: 5
  embargo_pct: 1.0                 # embargo after each test fold

# ── Logging ──────────────────────────────────────────────────
logging:
  level: "INFO"
  log_to_file: true
  log_file: "trading_bot.log"
