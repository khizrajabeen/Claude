<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markets — Meridian</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>◈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>
<div class="aurora"></div>
<div class="shell">
  <aside class="rail" data-nav></aside>
  <main class="main">
    <div class="page-head">
      <h1>Markets</h1>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <span class="small muted" id="asof"></span>
      <button class="btn sm" data-toggle-theme>◐</button>
    </div>
    <div id="banner"></div>
    <section class="tiles" id="tiles"></section>

    <section class="card">
      <div class="toolbar">
        <input type="text" id="q" placeholder="Filter by market…">
        <button class="chip" id="only-tradable" aria-pressed="true">Tradable only</button>
        <button class="chip" id="only-new" aria-pressed="false">New listings</button>
        <button class="chip" id="only-held" aria-pressed="false">In my universe</button>
      </div>
      <div class="scroll"><table id="table"></table></div>
      <div id="empty"></div>
    </section>
  </main>
</div>
<script type="module" src="./assets/markets.js"></script>
</body>
</html>
