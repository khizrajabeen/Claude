<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal — Meridian</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"auto"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections"></nav>
  <div class="main">
    <header class="topbar">
      <h1>Journal</h1>
      <nav class="tabs" aria-label="Views"></nav>
      <span class="grow"></span>
      <span class="pill" id="fresh"><span class="dot-live"></span><span>loading…</span></span>
      <span data-toggle-theme></span>
    </header>
    <main class="content">
      <div class="grid cols-4" id="tiles" style="margin-bottom:16px"></div>
      <div class="grid split" style="margin-bottom:16px">
        <section class="card">
          <div class="card-head"><h2>Daily P&amp;L</h2><span class="grow"></span>
            <span class="pill" id="period">—</span></div>
          <div class="card-body"><div id="bars" style="min-height:260px"></div></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>How trades ended</h2></div>
          <div class="card-body" id="exits"></div>
        </section>
      </div>
      <section class="card">
        <div class="card-head"><h2>Day by day</h2></div>
        <div class="card-body flush"><div class="tbl-wrap"><table class="tbl" id="tbl">
          <thead><tr><th>Day</th><th class="r">Realised</th><th class="r">Return</th>
            <th class="r">Equity</th><th>Where it came from</th></tr></thead><tbody></tbody></table></div></div>
      </section>
    </main>
  </div>
</div>
<script type="module" src="assets/journal.js"></script>
</body>
</html>
