<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trades — Meridian</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"auto"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections"></nav>
  <div class="main">
    <header class="topbar">
      <h1>Trades</h1>
      <nav class="tabs" aria-label="Views"></nav>
      <span class="grow"></span>
      <span class="pill" id="fresh"><span class="dot-live"></span><span>loading…</span></span>
      <span data-toggle-theme></span>
    </header>
    <main class="content">
      <div class="grid cols-4" id="tiles" style="margin-bottom:16px"></div>
      <section class="card">
        <div class="card-head">
          <h2>Closed trades</h2>
          <span class="grow"></span>
          <select id="f-class" class="btn-quiet" style="padding:7px 10px"></select>
          <select id="f-strat" class="btn-quiet" style="padding:7px 10px"></select>
          <select id="f-exit"  class="btn-quiet" style="padding:7px 10px"></select>
          <button class="btn-quiet" id="reset" type="button">Reset</button>
        </div>
        <div class="card-body flush"><div class="tbl-wrap"><table class="tbl" id="tbl">
          <thead><tr>
            <th class="sortable" data-k="closed_on_day">Closed</th>
            <th class="sortable" data-k="symbol">Asset</th>
            <th class="sortable" data-k="strategy">Strategy</th>
            <th class="sortable" data-k="side">Side</th>
            <th class="sortable r" data-k="entry_price">Entry</th>
            <th class="sortable r" data-k="exit_price">Exit</th>
            <th class="sortable r" data-k="r_multiple">R</th>
            <th class="sortable r" data-k="pnl">P&amp;L</th>
            <th class="sortable" data-k="exit_reason">Exit</th>
          </tr></thead><tbody></tbody>
        </table></div></div>
      </section>
    </main>
  </div>
</div>
<script type="module" src="assets/trades.js"></script>
</body>
</html>
