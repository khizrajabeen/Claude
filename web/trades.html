<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trades — Meridian</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>◈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
/* Resolve the theme before first paint. Without this a page whose
   stylesheet defaults to dark flashes dark at someone who chose light —
   the one frame of wrongness people notice most. */
try {
  var t = localStorage.getItem("theme") || "auto";
  document.documentElement.dataset.theme = t;
} catch (e) { document.documentElement.dataset.theme = "auto"; }
</script>
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>
<div class="aurora"></div>
<div class="shell">
  <aside class="rail" data-nav></aside>
  <main class="main">
    <div class="page-head">
      <h1>Trades</h1>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <span class="small muted" id="asof"></span>
      <span data-toggle-theme></span>
    </div>
    <div id="banner"></div>
    <section class="tiles" id="tiles"></section>

    <section class="card">
      <div class="toolbar">
        <input type="text" id="q" placeholder="Filter by market or strategy…">
        <select id="side"><option value="">Both sides</option>
          <option value="long">Long</option><option value="short">Short</option></select>
        <select id="outcome"><option value="">All outcomes</option>
          <option value="win">Winners</option><option value="loss">Losers</option></select>
        <select id="strategy"><option value="">All strategies</option></select>
      </div>
      <div class="scroll"><table id="table"></table></div>
      <div id="empty"></div>
    </section>
  </main>
</div>
<script type="module" src="./assets/trades.js"></script>
</body>
</html>
