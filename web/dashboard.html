<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Meridian</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"auto"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections"></nav>

  <div class="main">
    <header class="topbar">
      <h1>Dashboard</h1>
      <nav class="tabs" aria-label="Views"></nav>
      <span class="grow"></span>
      <span class="pill" id="fresh"><span class="dot-live"></span><span>loading…</span></span>
      <span data-toggle-theme></span>
      <span class="who"><span class="av" id="avatar">—</span><span id="mode">paper</span></span>
    </header>

    <main class="content">
      <div class="grid cols-4" id="tiles" style="margin-bottom:16px"></div>

      <div class="grid split" style="margin-bottom:16px">
        <section class="card">
          <div class="card-head">
            <h2>Performance</h2>
            <span class="pill" id="badges"></span>
            <span class="grow"></span>
            <div class="seg" id="range" role="group" aria-label="Chart range">
              <button data-days="14" type="button">14D</button>
              <button data-days="30" type="button">30D</button>
              <button data-days="90" type="button" aria-pressed="true">90D</button>
            </div>
          </div>
          <div class="card-body">
            <div class="legend" id="legend" style="margin-bottom:14px"></div>
            <div id="curve" style="min-height:280px"></div>
            <p class="muted" id="caveat" style="font-size:12px;margin-top:14px;line-height:1.5"></p>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>Open positions</h2>
            <span class="grow"></span><span class="pill" id="poscount">—</span></div>
          <div class="card-body flush"><div class="rows" id="positions"></div></div>
        </section>
      </div>

      <div class="grid cols-3">
        <section class="card">
          <div class="card-head"><h2>Where P&amp;L came from</h2></div>
          <div class="card-body">
            <div id="donut" style="margin-bottom:16px"></div>
            <div class="legend" id="donut-legend" style="flex-direction:column;gap:9px"></div>
          </div>
          <div class="card-body" style="border-top:1px solid var(--line-soft);
               display:flex;justify-content:space-between" id="riskstats"></div>
        </section>

        <section class="card">
          <div class="card-head"><h2>Top movers</h2><span class="grow"></span>
            <span class="muted" style="font-size:12px">24h</span></div>
          <div class="card-body flush"><div class="grid split-even" id="movers"></div></div>
        </section>

        <section class="card">
          <div class="card-head"><h2>Market intelligence</h2><span class="grow"></span>
            <span class="muted" style="font-size:12px" id="newscount"></span></div>
          <div class="card-body flush"><div id="news"></div></div>
        </section>
      </div>
    </main>
  </div>
</div>
<script type="module" src="assets/dashboard.js"></script>
</body>
</html>
